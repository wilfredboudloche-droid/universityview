<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Night Tech Literacy Football</title>
  <style>
    :root {
      --field-green: #1B4D2E;
      --field-green-dark: #12351F;
      --chalk-white: #FFFFFF;
      --ref-stripe: #111111;
      --gold: #FFD700;
      --accent-red: #D9534F;
      --stadium-dark: #0D1B11;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background-color: var(--stadium-dark);
      color: var(--chalk-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    #game-container {
      width: 100%;
      max-width: 850px;
      background: var(--field-green);
      border: 4px solid var(--gold);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* JUMBOTRON / SCOREBOARD */
    .scoreboard {
      background-color: var(--ref-stripe);
      border-bottom: 4px solid var(--gold);
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .stat-box {
      background: #222;
      border: 1px solid #444;
      padding: 8px;
      border-radius: 6px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #AAA;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: Arial, sans-serif;
    }

    .stat-value {
      font-size: 1.4rem;
      color: var(--gold);
      margin-top: 2px;
    }

    /* FOOTBALL FIELD TRACKER */
    .field-wrapper {
      position: relative;
      background: repeating-linear-gradient(
        90deg,
        var(--field-green),
        var(--field-green) 40px,
        var(--field-green-dark) 40px,
        var(--field-green-dark) 80px
      );
      height: 70px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .endzone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40px;
      background: var(--gold);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      writing-mode: vertical-rl;
      text-transform: uppercase;
      font-weight: bold;
    }

    .endzone.left { left: 0; }
    .endzone.right { right: 0; }

    .football-icon {
      position: absolute;
      left: 10%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      transition: left 0.6s ease-in-out;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));
    }

    /* GAMEPLAY PLAYBOOK */
    .playbook {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: var(--field-green);
    }

    .announcer-banner {
      background: rgba(0, 0, 0, 0.6);
      border-left: 5px solid var(--gold);
      padding: 10px 15px;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      min-height: 42px;
      display: flex;
      align-items: center;
    }

    .scenario-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 15px;
    }

    .scenario-title {
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .scenario-text {
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .play-btn {
      background: var(--ref-stripe);
      color: var(--chalk-white);
      border: 2px solid var(--chalk-white);
      padding: 12px 15px;
      border-radius: 6px;
      text-align: left;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    /* SCREEN OVERLAYS */
    .overlay-screen {
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .action-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .action-btn:hover {
      transform: scale(1.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  
  <!-- JUMBOTRON HEADER -->
  <div class="scoreboard">
    <div class="stat-box">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score-display">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">DOWN & DIST</div>
      <div class="stat-value" id="down-display">1st & 10</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">FIELD POS</div>
      <div class="stat-value" id="yard-display">Own 20</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">RANK</div>
      <div class="stat-value" id="rank-display" style="font-size:1rem;">Rookie</div>
    </div>
  </div>

  <!-- FIELD TRACKER -->
  <div class="field-wrapper">
    <div class="endzone left">START</div>
    <div class="football-icon" id="football">🏈</div>
    <div class="endzone right">TOUCHDOWN</div>
  </div>

  <!-- GAMEPLAY PLAYBOOK AREA -->
  <div class="playbook" id="playbook-area">
    <div class="announcer-banner" id="announcer">
      🎙️ "Welcome to Friday Night Lights! Drive 80 yards downfield by choosing the correct Canvas navigation plays!"
    </div>

    <div class="scenario-card">
      <div class="scenario-title" id="play-call-title">PLAY 1</div>
      <div class="scenario-text" id="scenario-question">Loading play options...</div>
    </div>

    <div class="options-grid" id="options-container">
      <!-- Options injected via JavaScript -->
    </div>
  </div>

  <!-- GAME OVER / TOUCHDOWN SCREEN -->
  <div class="overlay-screen hidden" id="end-screen">
    <h1 id="end-title" style="font-size: 2.5rem; color: var(--gold);">TOUCHDOWN!</h1>
    <p id="end-desc" style="font-family: Arial; max-width: 500px; line-height: 1.5;"></p>
    <div class="stat-box" style="padding: 15px 30px; margin-top: 10px;">
      <div class="stat-label">FINAL SCORE</div>
      <div class="stat-value" id="final-score" style="font-size: 2rem;">0</div>
    </div>
    <button class="action-btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>

</div>

<script>
  const plays = [
    {
      title: "1st Down - Play Call 1: The Main Pathway",
      question: "You need to find the sequential flow of your entire course curriculum, including readings and assignments. Which direction do you call?",
      options: [
        { text: "Option A: Check the 'Assignments' tab for a direct list.", correct: false, yards: -5, feedback: "Tackled for a 5-yard loss! Assignments list graded work, but 'Modules' is the true main pathway." },
        { text: "Option B: Open 'Modules' and follow the sequential order.", correct: true, yards: 20, feedback: "BIG GAIN! +20 Yards! Modules contain the complete, step-by-step pathway for the course." },
        { text: "Option C: Check your global Canvas Dashboard.", correct: false, yards: 0, feedback: "Incomplete Pass! Dashboard gives high-level updates, not the sequential course content." }
      ]
    },
    {
      title: "2nd Down - Play Call 2: Unlocking the Pathway",
      question: "You hit a locked module page that requires manual acknowledgment before you can move forward. What's the play?",
      options: [
        { text: "Option A: Click the 'Mark as Done' button at the top/bottom of the page.", correct: true, yards: 20, feedback: "Breakaway Run! +20 Yards! Clicking 'Mark as Done' explicitly unlocks the next lesson." },
        { text: "Option B: Email your teacher immediately to unlock it.", correct: false, yards: -10, feedback: "Sack! -10 Yards! Save emails for personal issues; self-service requirements are built into Canvas." },
        { text: "Option C: Wait for the next calendar day.", correct: false, yards: 0, feedback: "Delay of Game! Pages unlock instantly once requirements like 'Mark as Done' are completed." }
      ]
    },
    {
      title: "3rd Down - Play Call 3: Staying Informed",
      question: "You want instant mobile alerts the exact moment a grade or announcement is posted. What setup is required?",
      options: [
        { text: "Option A: Check the Canvas Student App dashboard once every evening.", correct: false, yards: 0, feedback: "Incomplete Pass! Periodic checks aren't instant notifications." },
        { text: "Option B: Set Account Notifications for Grading & Announcements to 'Notify Immediately'.", correct: true, yards: 25, feedback: "Deep Post Pass! +25 Yards! Immediate notifications keep you ahead of every deadline." },
        { text: "Option C: Send yourself daily calendar updates.", correct: false, yards: -5, feedback: "Out of Bounds! Automated Account notifications are much faster and accurate." }
      ]
    },
    {
      title: "4th Down - Play Call 4: Red Zone Support",
      question: "You run into a technical wall with a course assignment and need 1-on-1 assistance. What's your execution?",
      options: [
        { text: "Option A: Click 'Schedule Help Call' on the Canvas Home Page.", correct: true, yards: 20, feedback: "TOUCHDOWN! +20 Yards! Scheduling a help call is your primary key for 1-on-1 support." },
        { text: "Option B: Post a public message in the general discussion board.", correct: false, yards: 0, feedback: "Incomplete Pass! For 1-on-1 technical help, scheduling a call is the recommended route." },
        { text: "Option C: Wait until the final deadline at the end of the term.", correct: false, yards: -15, feedback: "Turnover on Downs! Waiting until the end of the term leads to falling behind!" }
      ]
    }
  ];

  let currentPlay = 0;
  let currentYardLine = 20; // Start at own 20 (80 yards to goal)
  let score = 0;
  let down = 1;

  function updateUI() {
    // Score & Yards
    document.getElementById('score-display').innerText = score;
    document.getElementById('yard-display').innerText = currentYardLine >= 50 ? `Opp ${100 - currentYardLine}` : `Own ${currentYardLine}`;
    document.getElementById('down-display').innerText = `${down}st & 10`;

    // Move football (Percentage from 0 to 100 on field)
    const fieldPercent = Math.min(Math.max((currentYardLine / 100) * 80 + 10, 10), 90);
    document.getElementById('football').style.left = `${fieldPercent}%`;

    // Player Rank
    const rankDisplay = document.getElementById('rank-display');
    if (score < 200) rankDisplay.innerText = "Rookie";
    else if (score < 400) rankDisplay.innerText = "Varsity";
    else if (score < 600) rankDisplay.innerText = "All-Pro";
    else rankDisplay.innerText = "Hall of Fame";
  }

  function renderPlay() {
    if (currentPlay >= plays.length || currentYardLine >= 100) {
      endGame();
      return;
    }

    const playData = plays[currentPlay];
    document.getElementById('play-call-title').innerText = playData.title;
    document.getElementById('scenario-question').innerText = playData.question;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    playData.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'play-btn';
      btn.innerText = opt.text;
      btn.onclick = () => makePlay(opt);
      optionsContainer.appendChild(btn);
    });

    updateUI();
  }

  function makePlay(option) {
    const announcer = document.getElementById('announcer');
    
    if (option.correct) {
      currentYardLine += option.yards;
      score += option.yards * 10;
      announcer.style.borderLeftColor = "var(--gold)";
      announcer.innerText = `🎙️ ${option.feedback}`;
    } else {
      currentYardLine = Math.max(10, currentYardLine + option.yards);
      announcer.style.borderLeftColor = "var(--accent-red)";
      announcer.innerText = `🎙️ ${option.feedback}`;
    }

    currentPlay++;
    down = Math.min(currentPlay + 1, 4);

    if (currentYardLine >= 100 || currentPlay >= plays.length) {
      setTimeout(endGame, 1500);
    } else {
      setTimeout(renderPlay, 1500);
    }
  }

  function endGame() {
    document.getElementById('playbook-area').classList.add('hidden');
    const endScreen = document.getElementById('end-screen');
    endScreen.classList.remove('hidden');

    const endTitle = document.getElementById('end-title');
    const endDesc = document.getElementById('end-desc');
    const finalScore = document.getElementById('final-score');

    finalScore.innerText = score;

    if (currentYardLine >= 100) {
      endTitle.innerText = "🎉 TOUCHDOWN! DRIVE SUCCESSFUL!";
      endDesc.innerText = "Outstanding drive! You executed the Canvas navigation playbook flawlessly and earned full mastery of your digital classroom tools.";
    } else {
      endTitle.innerText = "TURNOVER ON DOWNS";
      endDesc.innerText = "Your drive stalled out before reaching the endzone. Review your Canvas navigation pathway in the course guide and try again!";
    }
  }

  function resetGame() {
    currentPlay = 0;
    currentYardLine = 20;
    score = 0;
    down = 1;
    document.getElementById('playbook-area').classList.remove('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('announcer').innerText = '🎙️ "Welcome back to the gridiron! Drive 80 yards downfield!"';
    renderPlay();
  }

  // Initialize
  renderPlay();
</script>
</body>
</html>
