<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Learning Superpower Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
    }

    .header p {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 4px;
    }

    /* ── CARD ── */
    .card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    /* ── TITLE SCREEN ── */
    .title-screen { text-align: center; }
    .title-screen .big-emoji { font-size: 56px; margin-bottom: 0.75rem; }
    .title-screen h2 { font-size: 1.5rem; font-weight: 700; color: #1a202c; margin-bottom: 0.5rem; }
    .title-screen p { font-size: 0.95rem; color: #4a5568; line-height: 1.6; margin-bottom: 1.75rem; }

    /* ── PROGRESS ── */
    .progress-wrap { margin-bottom: 1.25rem; }
    .progress-label { font-size: 0.8rem; color: #718096; margin-bottom: 6px; }
    .progress-bar { height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: #4299e1; border-radius: 99px; transition: width 0.35s ease; }

    /* ── QUESTION ── */
    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }

    /* ── OPTIONS ── */
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #2d3748;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: #4299e1;
      background: #ebf8ff;
    }

    .option-btn.selected {
      border-color: #3182ce;
      background: #ebf8ff;
      color: #1a365d;
      font-weight: 600;
    }

    /* ── NAV BUTTONS ── */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
    }

    .btn {
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid #cbd5e0;
      background: #fff;
      color: #4a5568;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover:not(:disabled) { background: #edf2f7; }

    .btn.primary {
      background: #3182ce;
      border-color: #3182ce;
      color: #fff;
    }

    .btn.primary:hover:not(:disabled) { background: #2b6cb0; border-color: #2b6cb0; }

    .btn:disabled { opacity: 0.35; cursor: default; }

    /* ── RESULT SCREEN ── */
    .result-screen { text-align: center; }
    .result-screen .result-emoji { font-size: 60px; margin-bottom: 0.5rem; }

    .result-badge {
      display: inline-block;
      background: #ebf8ff;
      color: #2b6cb0;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 0.75rem;
    }

    .result-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .result-desc {
      font-size: 0.95rem;
      color: #4a5568;
      line-height: 1.65;
      margin-bottom: 1.5rem;
      text-align: left;
      background: #f7fafc;
      border-left: 4px solid #4299e1;
      padding: 0.85rem 1rem;
      border-radius: 0 8px 8px 0;
    }

    .score-section { margin-bottom: 1.5rem; }
    .score-section h3 { font-size: 0.85rem; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .score-item {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      text-align: left;
    }

    .score-item .score-label { font-size: 0.8rem; color: #718096; margin-bottom: 2px; }
    .score-item .score-val { font-size: 1.1rem; font-weight: 700; color: #2d3748; }
    .score-item.top-score { border-color: #4299e1; background: #ebf8ff; }
    .score-item.top-score .score-label { color: #2b6cb0; }
    .score-item.top-score .score-val { color: #1a365d; }

    .snapshot-note {
      font-size: 0.82rem;
      color: #718096;
      background: #fffbeb;
      border: 1px solid #f6e05e;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .snapshot-note strong { color: #744210; }

    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn.retake {
      background: #fff;
      border-color: #cbd5e0;
      color: #4a5568;
    }

    /* ── START BUTTON ── */
    .start-btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .start-btn:hover { background: #2b6cb0; }

    /* ── DOTS ── */
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 1rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e2e8f0; transition: background 0.2s; }
    .dot.active { background: #4299e1; }

    @media (max-width: 480px) {
      .card { padding: 1.25rem; }
      .score-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧠 Learning Superpower Quiz</h1>
    <p>Discover your unique learning style in 7 questions</p>
  </div>
  <div class="card" id="app"></div>
</div>

<script>
  /* ── DATA ── */
  const QUESTIONS = [
    {
      text: "How do you prefer to learn something new?",
      options: [
        { text: "By watching videos or demonstrations", type: "V" },
        { text: "By reading and taking notes", type: "A" },
        { text: "By discussing it with others and explaining it out loud", type: "S" },
        { text: "By trying it hands-on and experimenting", type: "K" }
      ]
    },
    {
      text: "When studying or working, what helps you remember information best?",
      options: [
        { text: "Seeing diagrams, charts, or colors", type: "V" },
        { text: "Writing things down and organizing notes", type: "A" },
        { text: "Talking about the topic and teaching someone else", type: "S" },
        { text: "Doing activities or using real-life examples", type: "K" }
      ]
    },
    {
      text: "If you had to give a presentation, what would you rely on most?",
      options: [
        { text: "Slides with visuals and videos", type: "V" },
        { text: "A well-structured script with key points", type: "A" },
        { text: "A strong, engaging discussion with the audience", type: "S" },
        { text: "A hands-on demonstration or interactive activity", type: "K" }
      ]
    },
    {
      text: "What frustrates you the most when learning?",
      options: [
        { text: "When there's no visual reference or example", type: "V" },
        { text: "When information feels disorganized or scattered", type: "A" },
        { text: "When there's no opportunity to discuss or debate", type: "S" },
        { text: "When it's all theory and no practical application", type: "K" }
      ]
    },
    {
      text: "If you were solving a puzzle, how would you approach it?",
      options: [
        { text: "Look at the picture on the box and compare pieces", type: "V" },
        { text: "Sort pieces by shape and create a plan", type: "A" },
        { text: "Talk through ideas with someone while solving it together", type: "S" },
        { text: "Start putting pieces together and adjust as you go", type: "K" }
      ]
    },
    {
      text: "When faced with a new challenge, what's your first instinct?",
      options: [
        { text: "Search for a tutorial or visual guide", type: "V" },
        { text: "Research and take detailed notes", type: "A" },
        { text: "Talk to someone who has experience with it", type: "S" },
        { text: "Dive in and learn by trial and error", type: "K" }
      ]
    },
    {
      text: "How do you best recall information during a test or important moment?",
      options: [
        { text: "By picturing an image, chart, or scene in your mind", type: "V" },
        { text: "By remembering the notes or key points you wrote", type: "A" },
        { text: "By recalling a conversation or discussion you had", type: "S" },
        { text: "By thinking back to a time when you physically did it", type: "K" }
      ]
    }
  ];

  const RESULTS = {
    V: {
      emoji: "👁️",
      superpower: "Super Sight!",
      title: "The Visual Learner",
      desc: "You learn best through images, videos, and visual organization. Diagrams, infographics, and color-coded notes help you absorb information quickly. Try using mind maps, highlighted notes, and video tutorials to maximize your learning."
    },
    A: {
      emoji: "📝",
      superpower: "Memory Master!",
      title: "The Analytical Learner",
      desc: "You thrive on structure, reading, and writing. Detailed notes, outlines, and well-organized information make concepts stick. Try creating structured study guides, bullet-point summaries, and written reflections to boost retention."
    },
    S: {
      emoji: "💬",
      superpower: "Communication Champ!",
      title: "The Social Learner",
      desc: "You learn best by discussing and explaining things to others. Conversations, group activities, and storytelling strengthen your understanding. Try study groups, teaching concepts to peers, and verbal review sessions."
    },
    K: {
      emoji: "🛠️",
      superpower: "Action Hero!",
      title: "The Hands-On Learner",
      desc: "You need to experience things firsthand to fully grasp them. Learning by doing, experimenting, and real-world applications are your strengths. Try labs, simulations, projects, and practice problems to cement your knowledge."
    }
  };

  const TYPE_LABELS = {
    V: "👁️ Visual",
    A: "📝 Analytical",
    S: "💬 Social",
    K: "🛠️ Hands-On"
  };

  /* ── STATE ── */
  let shuffledQuestions = [];
  let answers = [];
  let current = 0;
  let phase = "title"; // title | quiz | result

  /* ── UTILS ── */
  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function calcResult() {
    const counts = { V: 0, A: 0, S: 0, K: 0 };
    shuffledQuestions.forEach((q, i) => {
      if (answers[i] !== null) counts[q.options[answers[i]].type]++;
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    return { top: sorted[0][0], counts };
  }

  /* ── ACTIONS ── */
  function startQuiz() {
    shuffledQuestions = shuffle(QUESTIONS).map(q => ({
      ...q,
      options: shuffle(q.options)
    }));
    answers = new Array(shuffledQuestions.length).fill(null);
    current = 0;
    phase = "quiz";
    render();
  }

  function selectOption(idx) {
    answers[current] = idx;
    render();
  }

  function goNext() {
    if (current < shuffledQuestions.length - 1) {
      current++;
    } else {
      phase = "result";
    }
    render();
  }

  function goPrev() {
    if (current > 0) { current--; render(); }
  }

  function retake() {
    phase = "title";
    render();
  }

  /* ── RENDER ── */
  function render() {
    const app = document.getElementById('app');

    if (phase === "title") {
      app.innerHTML = `
        <div class="title-screen">
          <div class="big-emoji">🧠</div>
          <h2>Discover Your Learning Superpower!</h2>
          <p>
            Everyone learns differently. This quick 7-question quiz will reveal your unique
            learning style so you can study smarter, not harder.<br><br>
            Answer honestly — there are no right or wrong answers!
          </p>
          <button class="start-btn" onclick="startQuiz()">Start Quiz →</button>
        </div>`;
      return;
    }

    if (phase === "result") {
      const { top, counts } = calcResult();
      const r = RESULTS[top];
      const scoreItems = Object.entries(counts).map(([k, v]) => `
        <div class="score-item ${k === top ? 'top-score' : ''}">
          <div class="score-label">${TYPE_LABELS[k]}</div>
          <div class="score-val">${v} / 7${k === top ? ' ⭐' : ''}</div>
        </div>`).join('');

      app.innerHTML = `
        <div class="result-screen">
          <div class="result-emoji">${r.emoji}</div>
          <div class="result-badge">Your Learning Superpower</div>
          <div class="result-title">${r.title}<br><span style="color:#3182ce">(${r.superpower})</span></div>
          <div class="result-desc">${r.desc}</div>
          <div class="score-section">
            <h3>Your Score Breakdown</h3>
            <div class="score-grid">${scoreItems}</div>
          </div>
          <div class="snapshot-note">
            📸 <strong>Submission reminder:</strong> Take a screenshot of this results page and submit it to your Canvas assignment.
          </div>
          <div class="btn-row">
            <button class="btn retake" onclick="retake()">↩ Retake Quiz</button>
          </div>
        </div>`;
      return;
    }

    /* ── QUIZ PHASE ── */
    const q = shuffledQuestions[current];
    const pct = (current / shuffledQuestions.length) * 100;
    const isLast = current === shuffledQuestions.length - 1;
    const answered = answers[current] !== null;

    const optionBtns = q.options.map((opt, i) => `
      <button class="option-btn${answers[current] === i ? ' selected' : ''}" onclick="selectOption(${i})">
        <strong>${String.fromCharCode(65 + i)})</strong> ${opt.text}
      </button>`).join('');

    const dots = shuffledQuestions.map((_, i) => `
      <div class="dot${i === current ? ' active' : ''}"></div>`).join('');

    app.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-label">Question ${current + 1} of ${shuffledQuestions.length}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="q-text">${q.text}</div>
      ${optionBtns}
      <div class="nav-row">
        <button class="btn" onclick="goPrev()" ${current === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn primary" onclick="goNext()" ${!answered ? 'disabled' : ''}>
          ${isLast ? 'See My Results 🎉' : 'Next →'}
        </button>
      </div>
      <div class="dots">${dots}</div>`;
  }

  /* ── INIT ── */
  render();
</script>
</body>
</html>
